[package]
name = "fecho"
version = "1.1.0"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "fecho_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-fs = "=2.6.0"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.13.2"
tauri-plugin-sql = { version = "=2.5.0", features = ["sqlite"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
aes-gcm = "=0.11.1"
pbkdf2 = "=0.13.0"
sha2 = "=0.11.0"
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
