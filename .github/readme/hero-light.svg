<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Fechô: finanças pessoais que separam o que é seu do que é de quem usa o seu cartão">
<style>
text{font-family:Inter,'Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif}
.d{stroke-dasharray:130;stroke-dashoffset:130;animation:d 1s cubic-bezier(.33,1,.68,1) forwards}
.f{opacity:0;animation:f .5s cubic-bezier(.33,1,.68,1) forwards}
.b{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:b .6s cubic-bezier(.33,1,.68,1) forwards}
@keyframes d{to{stroke-dashoffset:0}}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes b{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.d,.f,.b{animation:none;opacity:1;stroke-dashoffset:0;transform:none}}
</style>
<rect x="1" y="1" width="1278" height="398" rx="20" fill="#FFFFFF" stroke="#E7E5E4"/>
<g transform="translate(64 92) scale(1.25)" fill="none" stroke="#FF6000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
<polyline class="d" points="17,22 32,9 47,22"/>
<circle class="d" cx="32" cy="41" r="14" style="animation-delay:.25s"/>
</g>
<text class="f" x="160" y="158" font-size="76" font-weight="700" fill="#1C1917" letter-spacing="-2" style="animation-delay:.4s">Fechô</text>
<text class="f" x="66" y="232" font-size="26" fill="#78716C" style="animation-delay:.6s">Finanças pessoais que separam o que é seu</text>
<text class="f" x="66" y="268" font-size="26" fill="#78716C" style="animation-delay:.7s">do que é de quem usa o seu cartão.</text>
<g class="f" style="animation-delay:.9s" font-size="17" font-weight="600" fill="#C2410C">
<rect x="66" y="306" width="96" height="36" rx="18" fill="#FFF1E6"/><text x="114" y="330" text-anchor="middle">Offline</text>
<rect x="174" y="306" width="112" height="36" rx="18" fill="#FFF1E6"/><text x="230" y="330" text-anchor="middle">Windows</text>
<rect x="298" y="306" width="140" height="36" rx="18" fill="#FFF1E6"/><text x="368" y="330" text-anchor="middle">Sem nuvem</text>
</g>
<g class="f" style="animation-delay:.5s">
<rect x="736" y="56" width="480" height="288" rx="14" fill="#FFFFFF" stroke="#E7E5E4"/>
<rect x="768" y="90" width="28" height="18" rx="4" fill="#8B5CF6"/>
<text x="808" y="105" font-size="18" font-weight="600" fill="#1C1917">Cartão Roxo</text>
<text x="1184" y="105" font-size="16" fill="#78716C" text-anchor="end">Fatura de Outubro</text>
<text x="768" y="160" font-size="40" font-weight="700" fill="#1C1917" letter-spacing="-1">R$ 1.023,80</text>
<rect x="768" y="184" width="416" height="14" rx="7" fill="#F5F5F4"/>
</g>
<rect class="b" x="768" y="184" width="164" height="14" rx="7" fill="#FF6000" style="animation-delay:1s"/>
<rect class="b" x="934" y="184" width="128" height="14" rx="7" fill="#2563EB" style="animation-delay:1.25s"/>
<rect class="b" x="1064" y="184" width="120" height="14" rx="7" fill="#93C5FD" style="animation-delay:1.5s"/>
<g font-size="17">
<g class="f" style="animation-delay:1.1s"><circle cx="774" cy="236" r="6" fill="#FF6000"/><text x="790" y="242" fill="#1C1917">Meu</text><text x="1184" y="242" fill="#1C1917" font-weight="600" text-anchor="end">R$ 403,45</text></g>
<g class="f" style="animation-delay:1.35s"><circle cx="774" cy="274" r="6" fill="#2563EB"/><text x="790" y="280" fill="#1C1917">Ana</text><text x="1184" y="280" fill="#1C1917" font-weight="600" text-anchor="end">R$ 320,00</text></g>
<g class="f" style="animation-delay:1.6s"><circle cx="774" cy="312" r="6" fill="#93C5FD"/><text x="790" y="318" fill="#1C1917">Bruno</text><text x="1184" y="318" fill="#1C1917" font-weight="600" text-anchor="end">R$ 300,35</text></g>
<g class="f" style="animation-delay:2.2s" fill="#15803D" font-weight="600"><path d="M838 274l5 5 9-10" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="860" y="280">depositou</text></g>
</g>
</svg>
